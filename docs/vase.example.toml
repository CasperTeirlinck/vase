# vase config. On first run vase writes this to ~/Library/Application Support/vase/config.toml on
# macOS, and to %APPDATA%\vase\config.toml on Windows.

# Favorite apps, shown first in the app picker. Toggle one from the picker with "f"; vase keeps this list updated.
favorites = []

# Outline the focused pane with an accent border when a tab is split. Off by default.
focus_border = false

# Theme: how the chrome is drawn, and the colors it is drawn in.
# style = "native" (the default) draws the platform's own design language: Liquid Glass on macOS, Fluent on
# Windows, taking its colors, font, and accent from the system, so the palette below does not apply to it.
# "powerline" draws vase's own interlocking bar, which the palette does apply to.
# Built-in palette names: one-dark (default), nord, gruvbox, tokyo-night, catppuccin, fluent-dark, fluent-light.
# [theme]
# style = "native"
# name = "one-dark"
# accent = "#c7663c"   # the mark and every highlight (focus outline, current-row accent, markers)
# bg = "#21252b"       # tab-bar strip and inactive tabs
# active = "#3b3f4c"   # selected tab and list highlight
# text = "#abb2bf"     # primary text
# dim = "#5c6370"      # index numbers and dimmed rows
# dim_bg = "#171a20"   # recessed fill for an off-monitor tab
# badge = "#ff453a"    # notification dot
# border = "#5c6370"   # tab and card outlines
# hotkey = "#d9dee5"   # bright outline for a focus-hotkey tab

# Tab-bar leading mark: "vase" (the logo, default), "" to hide it (the first tab then caps like a stack), or any glyph.
# Position: "top" or "bottom".
# Windowless: apps that are running but own no window, drawn as bare icons after the last tab (click one to bring the
# app back, the way its Dock icon does). "seen" (default) shows only apps whose window you closed this session, "all"
# lists every running app without a window, "off" shows none. Windows keeps no such list, so nothing is drawn there.
# Titles: true (default) labels an unnamed tab with its window's title; false shows just the icon.
# [tabbar]
# mark = "vase"
# position = "top"
# windowless = "seen"
# titles = true

# A global hotkey that toggles focus to an app: press the chord to bring it forward, press again to hide it.
# Add one [[app_focus]] block per app.
[[app_focus]]
# modifiers (ctrl, cmd, alt, shift) joined with "+", then a key name
# (a letter, a digit, or grave, space, escape, tab, ...)
key = "ctrl+grave"
# app name as shown in the menu bar / Cmd-Tab
app = "Ghostty"
