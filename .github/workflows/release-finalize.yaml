# Finalize a release when its release PR is merged:
# tag the merge commit, publish the draft release, and delete the release branch.

name: Release finalize

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  finalize:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Version from branch name
        run: echo "VERSION=${GITHUB_HEAD_REF#release/v}" >> "$GITHUB_ENV"

      - name: Tag the merge commit and publish the draft release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const sha = context.payload.pull_request.merge_commit_sha;
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/tags/${tag}`, sha,
            });
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo,
            });
            const draft = releases.find(r => r.tag_name === tag && r.draft);
            if (!draft) { core.setFailed(`no draft release found for ${tag}`); return; }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: draft.id, draft: false, target_commitish: sha,
            });

      - name: Delete the release branch
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `heads/release/v${process.env.VERSION}`,
            });
